name: Update IPTV Sources

on:
  schedule:
    # 每 6 小时跑一次 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 环境探测 (出口 IP / 接口可达性)
        run: |
          echo "=== 出口 IP ==="
          curl -s -m 10 https://api.ipify.org || echo "ipify failed"
          echo
          echo "=== 频道表接口可达性 ==="
          curl -s -m 15 -o /tmp/status.json -w "http=%{http_code} time=%{time_total}s\n" \
            "http://sj.91kds.cn/lb/get_status_91ktv.php" || echo "接口不可达"
          head -c 300 /tmp/status.json 2>/dev/null || true
          echo

      - name: 构建订阅
        id: build
        run: |
          python scripts/build.py --out out --jobs 40 --timeout 9 --gslb-jobs 4 || {
            echo "验活模式失败, 回退到 --no-probe"
            python scripts/build.py --out out --no-probe
          }
          echo "--- 产物 ---"
          ls -la out/
          python -c "
          import json
          s=json.load(open('out/stats.json'))
          print('频道', s.get('totalChannels'), '线路', s.get('totalLines'),
                '多线路频道', s.get('multiLineChannels'))
          print('源版本', s.get('meta',{}).get('sourceVersion'))
          "

      - name: 合并公开源池 (为每个台补充备选线路)
        run: |
          python scripts/merge_public.py --base out/live.m3u --out out/live.m3u \
            --jobs 48 --timeout 8 || echo "合并公开源失败 (非致命)"

      - name: 生成订阅索引页
        run: python scripts/genindex.py --out out || true

      - name: 产物校验
        run: |
          set -e
          # 防止把 git 冲突标记当成正常产物发布
          if grep -rl "^<<<<<<<" out/ 2>/dev/null; then
            echo "::error::产物中检出冲突标记, 中止发布"
            exit 1
          fi
          python - <<'PY'
          import json, os, re, sys
          from collections import defaultdict

          for n in ('stats.json', 'index.json', 'channels.json'):
              p = os.path.join('out', n)
              if os.path.exists(p):
                  json.load(open(p, encoding='utf-8'))
                  print('json ok:', n)

          m = os.path.getsize('out/live.m3u')
          if m < 1000:
              sys.exit('live.m3u 过小: %d' % m)
          print('live.m3u %d bytes' % m)

          # 回归检查: 同一频道不应出现 " #2" 后缀
          txt = open('out/live.m3u', encoding='utf-8').read()
          bad_tag = [l for l in txt.splitlines()
                     if l.startswith('#EXTINF') and re.search(r',\s*\S+\s#\d+$', l)]
          if bad_tag:
              sys.exit('检出线路编号后缀 %d 条, 会把线路显示成新频道: %s'
                       % (len(bad_tag), bad_tag[0][:80]))

          # 回归检查: 同名频道必须同 tvg-id
          name2ids = defaultdict(set)
          ids = defaultdict(int)
          noid = 0
          for l in txt.splitlines():
              if not l.startswith('#EXTINF'):
                  continue
              t = re.search(r'tvg-id="([^"]*)"', l)
              if not t:
                  noid += 1
                  continue
              nm = l.rsplit(',', 1)[-1].strip()
              name2ids[nm].add(t.group(1))
              ids[t.group(1)] += 1
          dup = {n: v for n, v in name2ids.items() if len(v) > 1}
          if dup:
              sys.exit('同名频道对应多个 tvg-id: %s' % list(dup.items())[:3])
          if noid:
              sys.exit('%d 条 EXTINF 缺少 tvg-id' % noid)

          # 回归检查: 纯数字 tvg-id 会把一批不相干的台塌成一个台
          numid = [k for k in ids if re.fullmatch(r'\d+', k)]
          if numid:
              sys.exit('检出纯数字 tvg-id, 会吞掉整批频道: %s' % numid[:5])

          # 回归检查: 单台线路数异常膨胀 (= 多个台被误并成一个)
          huge = {k: v for k, v in ids.items() if v > 40}
          if huge:
              print('::warning::疑似过度归并: %s'
                    % list(sorted(huge.items(), key=lambda x: -x[1]))[:5])

          multi = sum(1 for v in ids.values() if v > 1)
          print('频道 %d / 线路 %d / 多线路频道 %d'
                % (len(ids), sum(ids.values()), multi))
          if len(ids) and multi / len(ids) < 0.10:
              print('::warning::多线路频道占比偏低 (%.1f%%)'
                    % (multi / len(ids) * 100))
          PY

      - name: 提交变更
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/ data/
          if git diff --cached --quiet; then
            echo "无变更, 跳过提交"
            exit 0
          fi
          VER=$(python -c "import json;print(json.load(open('out/stats.json')).get('meta',{}).get('sourceVersion'))" 2>/dev/null || echo unknown)
          git commit -m "chore: update sources (ver=${VER}) $(date -u +%Y-%m-%dT%H:%MZ)"
          # 远端可能已被手动推送更新, 合并时以本次构建产物为准
          for i in 1 2 3; do
            if git push origin HEAD:main 2>/dev/null; then
              echo "push ok"; break
            fi
            echo "push 被拒, 第 $i 次重试: 合并远端后重推"
            git pull --no-rebase -X ours origin main || true
            git checkout --theirs out/ 2>/dev/null || true
            git add out/ data/
            git commit -m "merge: 保留本次构建产物" || true
            sleep 5
          done

      - name: 部署 Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.run_id }}"
